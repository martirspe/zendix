name: zendix
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev --workspace @zendix/web
    ports: ["127.0.0.1:4200:4200"]
    volumes:
      - .:/workspace
      - dependencies:/workspace/node_modules
      - angular_cache:/workspace/apps/web/.angular
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    init: true
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev --workspace @zendix/api
    environment:
      DATABASE_URL: postgresql://zendix:development_only@postgres:5432/zendix
      CHOKIDAR_USEPOLLING: "true"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-before-deployment}
      SES_EVENTS_TOPIC_ARN: ${SES_EVENTS_TOPIC_ARN:-}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AUTH_EMAIL_SES_REGION: ${AUTH_EMAIL_SES_REGION:-}
      AUTH_EMAIL_SES_CONFIGURATION_SET: ${AUTH_EMAIL_SES_CONFIGURATION_SET:-}
      AUTH_EMAIL_AWS_PROFILE: ${AUTH_EMAIL_AWS_PROFILE:-}
      AUTH_EMAIL_FROM_EMAIL: ${AUTH_EMAIL_FROM_EMAIL:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:4200}
      NODE_ENV: development
      DEV_SENDER_EMAIL: ${DEV_SENDER_EMAIL:-}
      DEV_TEST_RECIPIENT: ${DEV_TEST_RECIPIENT:-}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ZENDIX_KEYS_PATH: /var/lib/zendix/keys
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - .:/workspace
      - dependencies:/workspace/node_modules
      - integration_keys:/var/lib/zendix/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    init: true
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://zendix:development_only@postgres:5432/zendix
    volumes:
      - .:/workspace
      - dependencies:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    init: true
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zendix
      POSTGRES_PASSWORD: development_only
      POSTGRES_DB: zendix
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zendix"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dependencies:
  angular_cache:
  postgres_data:
  redis_data:
  integration_keys:
