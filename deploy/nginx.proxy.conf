server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location /api/ {
        proxy_pass http://api:3000/;
        include /etc/nginx/proxy-headers.conf;
    }
    location ~ ^/(unsubscribe|email-view)/ {
        proxy_pass http://api:3000;
        include /etc/nginx/proxy-headers.conf;
    }
    location ~* \.(js|css|woff2?)$ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
